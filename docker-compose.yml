services:
  kafka:
    image: apache/kafka:3.7.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list"]
      interval: 5s
      timeout: 5s
      retries: 30
  kafka-init:
    image: apache/kafka:3.7.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic stats.user-actions.v1 --partitions 1 --replication-factor 1 --config retention.ms=-1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic stats.events-similarity.v1 --partitions 1 --replication-factor 1 --config cleanup.policy=compact
  analyzer-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: analyzer
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    volumes:
      - analyzer_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewm -d analyzer"]
      interval: 5s
      timeout: 3s
      retries: 20
  collector:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: stats/collector/target/collector-0.0.1-SNAPSHOT.jar
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  aggregator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: stats/aggregator/target/aggregator-0.0.1-SNAPSHOT.jar
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  analyzer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: stats/analyzer/target/analyzer-0.0.1-SNAPSHOT.jar
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://analyzer-db:5432/analyzer
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      analyzer-db:
        condition: service_healthy

  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: infra/config-server/target/config-server-0.0.1-SNAPSHOT.jar
    ports:
      - "8888:8888"
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: infra/discovery-server/target/discovery-server-0.0.1-SNAPSHOT.jar
    ports:
      - "8761:8761"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_HOST: discovery-server

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
  gateway-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: infra/gateway-server/target/gateway-server-0.0.1-SNAPSHOT.jar
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
  event-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: core/event-service/target/event-service-0.0.1-SNAPSHOT.jar
    ports:
      - "8081:8081"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://events-db:5432/events
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ewm

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      events-db:
        condition: service_healthy
  request-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: core/request-service/target/request-service-0.0.1-SNAPSHOT.jar
    ports:
      - "8082:8082"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://requests-db:5432/requests
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ewm

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      requests-db:
        condition: service_healthy
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: core/user-service/target/user-service-0.0.1-SNAPSHOT.jar
    ports:
      - "8083:8083"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://users-db:5432/users
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ewm

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      users-db:
        condition: service_healthy
  feature-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: core/feature-service/target/feature-service-0.0.1-SNAPSHOT.jar
    ports:
      - "8084:8084"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://features-db:5432/features
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ewm

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      features-db:
        condition: service_healthy
  stats-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: stats/stats-server/target/stats-server-0.0.1-SNAPSHOT.jar
    ports:
      - "9090:9090"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/stats
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ewm

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      stats-db:
        condition: service_healthy
  events-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    volumes:
      - events_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewm -d events"]
      interval: 5s
      timeout: 3s
      retries: 20
  requests-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: requests
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    volumes:
      - requests_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewm -d requests"]
      interval: 5s
      timeout: 3s
      retries: 20
  users-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    volumes:
      - users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewm -d users"]
      interval: 5s
      timeout: 3s
      retries: 20
  features-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: features
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    volumes:
      - features_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewm -d features"]
      interval: 5s
      timeout: 3s
      retries: 20
  stats-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    volumes:
      - stats_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewm -d stats"]
      interval: 5s
      timeout: 3s
      retries: 20
  # The shared CI uses `up --detach`, then waits only 60 seconds for ports.
  # This one-shot service keeps `up` waiting for the existing API healthchecks.
  # Its legacy name also makes the shared CI's `logs ewm-service` command valid.
  ewm-service:
    image: postgres:16.1
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 'Gateway, statistics and core API services are healthy'"]
    depends_on:
      gateway-server:
        condition: service_healthy
      stats-server:
        condition: service_healthy
      event-service:
        condition: service_healthy
      request-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      feature-service:
        condition: service_healthy
  newman:
    image: postman/newman:6-alpine
    profiles: ["test"]
    volumes:
      - ./postman:/etc/newman:ro
      - ./reports:/reports
    working_dir: /etc/newman
volumes:
  kafka_data:
  analyzer_data:
  events_data:
  requests_data:
  users_data:
  features_data:
  stats_data:
