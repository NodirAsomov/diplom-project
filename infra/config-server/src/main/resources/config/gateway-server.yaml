server:
  port: 8080
spring:
  cloud:
    gateway:
      routes:
        - id: requests
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/requests/**,/users/{userId}/events/{eventId}/requests/**
        - id: features
          uri: lb://feature-service
          predicates:
            - Path=/users/{userId}/subscriptions/**,/users/{userId}/comments/**,/users/{userId}/events/{eventId}/comments/**,/users/{userId}/events/{eventId}/like,/users/{userId}/events/{eventId}/dislike,/users/{userId}/events/{eventId}/rating,/events/{eventId}/comments/**,/admin/comments/**
        - id: users
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**
        - id: events
          uri: lb://event-service
          predicates:
            - Path=/events/**,/users/{userId}/events/**,/admin/events/**,/categories/**,/admin/categories/**,/compilations/**,/admin/compilations/**,/locations/**,/admin/locations/**
        - id: statistics
          uri: lb://stats-server
          predicates:
            - Path=/hit,/stats
