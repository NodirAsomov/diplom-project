server:
  port: 0
  shutdown: graceful
stats-server:
  service-id: stats-server
spring:
  datasource:
    url: ${MAIN_DATABASE_URL:jdbc:postgresql://localhost:6542/ewm-main}
    username: ${DATABASE_USERNAME:ewm}
    password: ${DATABASE_PASSWORD:ewm}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc.time_zone: UTC
  sql:
    init:
      mode: always
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC
eureka:
  client:
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 5
logging:
  level:
    root: info
    ru.practicum.ewm: debug
