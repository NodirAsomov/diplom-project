server:
  port: 0
spring:
  datasource:
    url: ${STATS_DATABASE_URL:jdbc:postgresql://localhost:6541/ewm-stats}
    username: ${DATABASE_USERNAME:ewm}
    password: ${DATABASE_PASSWORD:ewm}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
eureka:
  client:
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 5
