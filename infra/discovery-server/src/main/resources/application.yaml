server:
  port: 8761
spring:
  application:
    name: discovery-server
eureka:
  server:
    response-cache-update-interval-ms: 5000
  instance:
    hostname: ${EUREKA_HOST:localhost}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
